<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>WhatsApp Engine — Link Device</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f4f6f8;
      color: #1a1a1a;
    }
    h1 { font-size: 1.25rem; margin-bottom: 1rem; }
    #qr {
      width: 280px;
      height: 280px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
    }
    #connected {
      display: none;
      font-size: 1.5rem;
      color: #128c7e;
      font-weight: bold;
    }
    #hint { color: #666; margin-top: 1rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Scan QR untuk menghubungkan WhatsApp</h1>
  <img id="qr" alt="QR code" />
  <div id="connected">✅ Terhubung</div>
  <div id="hint">QR akan otomatis diperbarui setiap ~20 detik</div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const qrImg = document.getElementById('qr');
    const connectedEl = document.getElementById('connected');
    const hintEl = document.getElementById('hint');

    socket.on('qr:update', ({ qr }) => {
      qrImg.style.display = 'block';
      connectedEl.style.display = 'none';
      hintEl.style.display = 'block';
      qrImg.src = qr;
    });

    socket.on('qr:cleared', () => {
      qrImg.style.display = 'none';
    });

    socket.on('status:update', (status) => {
      if (status.status === 'open') {
        qrImg.style.display = 'none';
        hintEl.style.display = 'none';
        connectedEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
